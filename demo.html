<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Demo panelu sklepu</title><meta name="theme-color" content="#08080A"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="canonical" href="https://elok-agency.pl/demo.html"><meta property="og:type" content="website"><meta property="og:locale" content="pl_PL"><meta property="og:site_name" content="ELOK"><meta property="og:title" content="Demo panelu sklepu"><meta property="og:description" content=""><meta property="og:url" content="https://elok-agency.pl/demo.html"><meta property="og:image" content="https://elok-agency.pl/img/og.jpg"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image"><meta name="robots" content="noindex">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16161A;--text:#4A4A4A;--muted:#7A766E;--light:#ABABAB;--line:#E8E3D9;--line2:#F0ECE4;--bg:#F5F3EF;--card:#fff;
  --dark:#1B1B1B;--dark2:#252525;--gold:#C9A86A;--gold2:#B8925A;--goldt:#8A6D3B;--green:#1D6B3A;--red:#A3361F;--amber:#8A5A12;--blue:#3E6FB0;
  --r:12px;--font:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit;color:var(--ink)}
h1,h2,h3{color:var(--ink);margin:0;line-height:1.25}
h1{font-size:26px;font-weight:800;letter-spacing:-.01em}
h2{font-size:17px;font-weight:800}
h3{font-size:14px;font-weight:800}
.mono{font-family:var(--mono);font-size:.92em}
.muted{color:var(--muted)}.small{font-size:13px}.green{color:var(--green)}.red{color:var(--red)}.gold{color:var(--goldt)}
.nowrap{white-space:nowrap}

/* pasek demo */
.demobar{position:relative;z-index:60;background:linear-gradient(90deg,#2a2418,#3a2f1c);color:#F1E3C4;display:flex;align-items:center;justify-content:center;gap:12px;padding:7px 12px;font-size:13px;font-weight:600;flex-wrap:wrap;text-align:center}
.demobar b{color:#fff}
.demobar button{background:var(--gold);color:#1B1B1B;border:0;border-radius:999px;padding:5px 14px;font-weight:800;font-size:12.5px;cursor:pointer}
.demobar button:hover{background:#d8b97a}

/* układ */
.app{display:flex;min-height:100vh}
.side{width:248px;flex:0 0 248px;background:var(--dark);color:#D8D4CC;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;padding:22px 14px}
.logo{display:flex;align-items:center;gap:12px;padding:0 8px 22px;border-bottom:1px solid #2E2E2E;margin-bottom:14px}
.logo__mark{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--gold);display:grid;place-items:center;color:var(--gold);font-weight:800;font-size:16px}
.logo__t{font-weight:800;color:#fff;font-size:18px;letter-spacing:.06em;line-height:1.1}
.logo__s{font-size:10px;letter-spacing:.28em;color:var(--gold);font-weight:700}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;text-decoration:none;color:#D8D4CC;font-weight:600;font-size:15px;margin-bottom:2px;cursor:pointer;border-left:3px solid transparent}
.nav a:hover{background:#242424;color:#fff}
.nav a.on{background:#2A2A2A;color:#fff;border-left-color:var(--gold)}
.nav svg{width:19px;height:19px;flex:0 0 19px;opacity:.9}
.nav .badge{margin-left:auto}
.badge{background:var(--red);color:#fff;border-radius:999px;font-size:11.5px;font-weight:800;min-width:22px;height:22px;display:inline-grid;place-items:center;padding:0 6px}
.badge--gold{background:var(--gold);color:#1B1B1B}
.side__foot{margin-top:auto;padding:14px 10px 0;border-top:1px solid #2E2E2E;font-size:12px;color:#8C877D}
.main{flex:1;min-width:0;padding:28px 32px 60px}
.topbar{display:none}
.bnav{display:none}

/* elementy */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.head p{margin:4px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:18px;min-width:0}
.card h2{margin-bottom:12px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:10px;padding:10px 16px;font-weight:700;font-size:14px;cursor:pointer;text-decoration:none;line-height:1.2;white-space:nowrap}
.btn:hover{background:#000}
.btn--gold{background:var(--gold2);border-color:var(--gold2);color:#fff}.btn--gold:hover{background:#a5824f}
.btn--line{background:#fff;color:var(--ink);border-color:#D9D3C7}.btn--line:hover{background:#FAF8F4}
.btn--ghost{background:transparent;color:var(--ink);border-color:transparent}.btn--ghost:hover{background:#EFEBE3}
.btn--sm{padding:7px 12px;font-size:13px;border-radius:9px}
.btn--block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.inp{width:100%;border:1px solid #DCD6CB;border-radius:10px;padding:10px 12px;background:#fff;font-size:15px;outline:none;min-width:0}
.inp:focus{border-color:var(--gold2);box-shadow:0 0 0 3px rgba(184,146,90,.15)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700;color:var(--ink)}
label.f small{font-weight:500;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:700;background:#F3EFE7;background:color-mix(in srgb,var(--c) 12%,#fff);color:var(--c);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.tag{display:inline-block;background:#F1EDE5;color:var(--text);border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700}
.eyebrow{font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--goldt);font-weight:800}
.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0}
.row+.row{border-top:1px solid var(--line2)}
.total{font-size:18px;color:var(--ink);font-weight:800}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid #DCD6CB;background:#fff;border-radius:999px;padding:6px 13px;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip .n{opacity:.65}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.search{position:relative;flex:1;min-width:200px;max-width:520px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted)}
.search .inp{padding-left:38px}
.empty{text-align:center;color:var(--muted);padding:28px 10px}

/* tabele → karty na telefonie */
.tbl-wrap{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800;padding:13px 16px;background:#FBFAF7;border-bottom:1px solid var(--line)}
.tbl td{padding:14px 16px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover{background:#FCFBF8}
.tbl .n{text-align:right;white-space:nowrap}
.tbl .ttl b{color:var(--ink)}

/* kafelki KPI */
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;cursor:default;min-width:0}
.kpi.click{cursor:pointer}.kpi.click:hover{border-color:var(--gold2)}
.kpi small{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800}
.kpi b{display:block;font-size:28px;color:var(--ink);font-weight:800;margin-top:6px;letter-spacing:-.01em}
.kpi span{font-size:13px;color:var(--muted)}
.todo{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line2);cursor:pointer}
.todo:first-of-type{border-top:0}
.todo i{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:0 0 36px;font-style:normal;font-weight:800;background:#F3EFE7;background:color-mix(in srgb,var(--c) 12%,#fff);color:var(--c)}
.todo div{flex:1;min-width:0}
.todo b{color:var(--ink)}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:10px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.bars span.b{width:100%;max-width:38px;background:var(--gold);border-radius:6px 6px 2px 2px;min-height:4px;transition:height .4s}
.bars div.today span.b{background:var(--ink)}
.bars em{font-style:normal;font-size:11.5px;color:var(--muted)}
.bars strong{font-size:11px;color:var(--ink);font-weight:700}

/* oś czasu */
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;padding:0 0 14px 22px;font-size:13.5px}
.tl li::before{content:"";position:absolute;left:5px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--gold2)}
.tl li::after{content:"";position:absolute;left:9px;top:17px;bottom:0;width:1px;background:var(--line)}
.tl li:last-child::after{display:none}
.tl small{display:block;color:var(--muted)}
.steps{display:flex;gap:4px;margin:4px 0 18px}
.steps div{flex:1;height:6px;border-radius:4px;background:#E6E0D4}
.steps div.on{background:var(--gold2)}
.stepnames{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:-12px;margin-bottom:16px;gap:4px}
.stepnames span{flex:1;text-align:center}
.stepnames span.on{color:var(--ink);font-weight:700}
.mailrow{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line2);font-size:13.5px}
.mailrow:first-of-type{border-top:0}

/* modal / toast / ładowanie */
.ov{position:fixed;inset:0;background:rgba(18,16,12,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .15s}
.modal{background:#fff;border-radius:18px;width:100%;max-width:560px;max-height:calc(100vh - 32px);overflow:auto;padding:24px;position:relative;box-shadow:0 24px 60px rgba(0,0,0,.25);animation:pop .18s}
.modal--wide{max-width:760px}
.modal h3{font-size:19px;margin:0 30px 6px 0}
.modal .x{position:absolute;right:14px;top:12px;border:0;background:none;font-size:26px;line-height:1;cursor:pointer;color:var(--muted);padding:4px 8px}
.modal__foot{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;width:calc(100% - 32px);max-width:440px;pointer-events:none}
.toast{background:var(--ink);color:#fff;border-radius:12px;padding:12px 16px;font-size:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:up .2s;pointer-events:auto;display:flex;gap:10px;align-items:center;width:100%}
.toast.ok::before{content:"✓";color:#7DD3A0;font-weight:800}
.toast.err{background:var(--red)}
.toast button{margin-left:auto;background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:8px;padding:5px 10px;font-weight:700;font-size:12.5px;cursor:pointer;white-space:nowrap}
.loader{text-align:center;padding:16px 4px 6px}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid #EFE8DA;border-top-color:var(--gold2);animation:rot .8s linear infinite;margin:0 auto 16px}
.loader ol{list-style:none;padding:0;margin:14px auto 0;text-align:left;max-width:320px;font-size:14px}
.loader li{padding:4px 0;color:var(--light);display:flex;gap:8px}
.loader li.on{color:var(--ink);font-weight:700}
.loader li.done{color:var(--green)}
.loader li::before{content:"○";width:16px}
.loader li.on::before{content:"●";color:var(--gold2)}
.loader li.done::before{content:"✓"}
.prog{height:10px;background:#EFE8DA;border-radius:6px;overflow:hidden;margin:16px 0 6px}
.prog i{display:block;height:100%;width:0;background:var(--gold2);transition:width .2s}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}}
@keyframes up{from{transform:translateY(12px);opacity:0}}

/* podgląd maila / dokumentu / etykiety */
.mail{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#F7F5F0}
.mail__meta{background:#fff;padding:12px 16px;font-size:13px;border-bottom:1px solid var(--line)}
.mail__meta div{display:flex;gap:8px}.mail__meta span{color:var(--muted);width:52px;flex:0 0 52px}
.mail__body{padding:18px}
.mail__card{background:#fff;border-radius:12px;overflow:hidden;max-width:520px;margin:0 auto}
.mail__hd{background:var(--dark);color:#fff;padding:16px 20px;font-weight:800;letter-spacing:.08em}
.mail__hd small{display:block;color:var(--gold);font-size:10px;letter-spacing:.25em}
.mail__ct{padding:20px;font-size:14px;color:var(--text)}
.mail__ct h4{margin:0 0 10px;color:var(--ink);font-size:18px}
.mail__btn{display:inline-block;background:var(--gold2);color:#fff;border-radius:10px;padding:10px 18px;font-weight:800;text-decoration:none;margin-top:8px}
.doc{border:1px solid var(--line);border-radius:12px;padding:22px;background:#fff;font-size:13px}
.doc table{width:100%;border-collapse:collapse;margin:14px 0}
.doc th,.doc td{border:1px solid #DDD7CC;padding:6px 8px;text-align:left}
.doc th{background:#F6F3EC;font-size:12px}
.doc .n{text-align:right;white-space:nowrap}
.doc__hd{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:10px}
.doc__hd b{color:var(--ink)}
.label{width:100%;max-width:300px;aspect-ratio:2/3;margin:0 auto;border:2px solid #111;border-radius:6px;padding:14px;font-family:var(--mono);font-size:11.5px;color:#111;display:flex;flex-direction:column;gap:10px;background:#fff}
.label .big{font-size:20px;font-weight:800;font-family:var(--font)}
.label .bc{height:70px;background:repeating-linear-gradient(90deg,#111 0 2px,#fff 2px 4px,#111 4px 5px,#fff 5px 8px,#111 8px 11px,#fff 11px 12px)}
.label hr{border:0;border-top:2px dashed #111;margin:0;width:100%}
.label .sec{display:flex;flex-direction:column;gap:2px}

/* edytor oferty */
.items .it{display:grid;grid-template-columns:minmax(0,1fr) 74px 110px 110px 34px;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line2)}
.items .it:first-child{border-top:0}
.items .it .inp{padding:8px 10px;font-size:14px}
.items .hd{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800;padding-bottom:4px;border-top:0}
.ib{border:0;background:none;cursor:pointer;color:var(--muted);font-size:20px;line-height:1;padding:6px}
.ib:hover{color:var(--red)}
.sugg{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 30px rgba(0,0,0,.12);z-index:20;max-height:300px;overflow:auto}
.sugg button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;border:0;background:none;padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--line2);font-size:14px}
.sugg button:hover{background:#FAF7F1}
.sugg small{color:var(--muted)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-top:1px solid var(--line2);cursor:pointer}
.switch:first-of-type{border-top:0}
.switch b{color:var(--ink);display:block}
.switch input{appearance:none;-webkit-appearance:none;width:46px;height:26px;border-radius:999px;background:#D9D3C7;position:relative;flex:0 0 46px;cursor:pointer;transition:background .2s;margin:0}
.switch input::after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;top:3px;left:3px;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked{background:var(--green)}
.switch input:checked::after{left:23px}
.car{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.car i{font-style:normal;width:34px;height:34px;border-radius:9px;background:#F1EDE5;display:grid;place-items:center}
.note{background:#FBF7EE;border-radius:10px;padding:10px 12px;font-size:13.5px;margin-bottom:8px}
.note small{display:block;color:var(--muted);font-size:12px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--gold2)}
.hint{background:#FBF2E2;border-radius:12px;padding:12px 14px;font-size:13.5px;margin-bottom:16px;color:#5C4518}

/* telefon / tablet */
@media (max-width:1100px){.split{grid-template-columns:minmax(0,1fr)}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){
  .side{position:fixed;left:0;top:0;height:100%;z-index:90;transform:translateX(-100%);transition:transform .2s;padding-top:20px}
  .side.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.45)}
  .main{padding:16px 16px 96px}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:50;background:var(--bg);padding:10px 12px;border-bottom:1px solid var(--line)}
  .topbar button{border:0;background:none;padding:6px;cursor:pointer;display:grid}
  .topbar b{font-size:17px;color:var(--ink);font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:55;background:var(--dark);padding:6px 4px calc(8px + env(safe-area-inset-bottom))}
  .bnav a{display:flex;flex-direction:column;align-items:center;gap:3px;color:#A9A49A;font-size:11px;font-weight:600;text-decoration:none;cursor:pointer;position:relative;padding:4px 0}
  .bnav a.on{color:var(--gold)}
  .bnav svg{width:22px;height:22px}
  .bnav .badge{position:absolute;top:-2px;left:calc(50% + 4px);min-width:18px;height:18px;font-size:10px}
  h1{font-size:22px}
  .head{margin-bottom:14px}
  .head .btn{flex:1}
  .card{padding:16px;border-radius:14px}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  .tbl thead{display:none}
  .tbl,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}
  .tbl tr{padding:12px 14px;border-bottom:1px solid var(--line2)}
  .tbl tr:last-child{border-bottom:0}
  .tbl td{padding:3px 0;border:0;display:flex;justify-content:space-between;gap:12px;text-align:right;align-items:baseline}
  .tbl td::before{content:attr(data-l);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:800;text-align:left;flex:0 0 auto}
  .tbl td.ttl{display:block;text-align:left;margin-bottom:4px}
  .tbl td.ttl::before{display:none}
  .tbl td:empty{display:none}
  .tbl .n{text-align:right}
  .items .it{grid-template-columns:minmax(0,1fr) 64px 34px;grid-template-areas:"n n x" "q p p";row-gap:8px}
  .items .it>:nth-child(1){grid-area:n}.items .it>:nth-child(2){grid-area:q}.items .it>:nth-child(3){grid-area:p}.items .it>:nth-child(4){display:none}.items .it>:nth-child(5){grid-area:x}
  .items .hd{display:none!important}
  .modal{padding:20px 18px;border-radius:16px}
  .modal__foot .btn{flex:1}
  .toasts{bottom:86px}
}

var modalEl = null;
function modal(html, wide) {
  closeModal();
  modalEl = document.createElement('div'); modalEl.className = 'ov';
  modalEl.innerHTML = '<div class="modal' + (wide ? ' modal--wide' : '') + '" role="dialog" aria-modal="true"><button type="button" class="x" data-act="close" aria-label="Zamknij">×</button>' + html + '</div>';
  modalEl.addEventListener('mousedown', function (e) { if (e.target === modalEl && !modalEl.dataset.lock) closeModal(); });
  document.body.appendChild(modalEl);
  var f = modalEl.querySelector('[autofocus]'); if (f) setTimeout(function () { f.focus(); }, 30);
  return modalEl;
}
function closeModal() { if (modalEl) { modalEl.remove(); modalEl = null; } }
function toast(msg, type, btn) {
  var t = document.createElement('div'); t.className = 'toast ' + (type || 'ok');
  t.innerHTML = '<span>' + esc(msg) + '</span>';
  if (btn) { var b = document.createElement('button'); b.type = 'button'; b.textContent = btn.label; b.onclick = function () { t.remove(); btn.fn(); }; t.appendChild(b); }
  document.getElementById('toasts').appendChild(t);
  setTimeout(function () { t.style.transition = 'opacity .3s'; t.style.opacity = '0'; setTimeout(function () { t.remove(); }, 300); }, btn ? 6000 : 3200);
}
/** Udawana operacja: kroki po kolei, potem done(). */
function work(title, steps, done, ms) {
  var m = modal('<div class="loader"><div class="spin"></div><h3 style="margin:0">' + esc(title) + '</h3><ol>' + steps.map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') + '</ol></div>');
  m.dataset.lock = 1; m.querySelector('.x').style.display = 'none';
  var li = m.querySelectorAll('li'), i = 0; ms = ms || 650;
  (function next() {
    if (i > 0) li[i - 1].className = 'done';
    if (i >= li.length) { setTimeout(function () { closeModal(); done(); }, 250); return; }
    li[i].className = 'on'; i++; setTimeout(next, ms + rnd(0, 250));
  })();
}
function confirmBox(title, text, okLabel, fn, danger) {
  modal('<h3>' + esc(title) + '</h3><p class="muted" style="margin:6px 0 0">' + text + '</p><div class="modal__foot"><button type="button" class="btn btn--line" data-act="close">Anuluj</button><button type="button" class="btn ' + (danger ? '' : 'btn--gold') + '" id="cOk">' + esc(okLabel) + '</button></div>');
  document.getElementById('cOk').onclick = function () { closeModal(); fn(); };
}

function setStatus(r, st, note) {
  r.status = st;
  var txt = { zamowione: 'Zamówione w hurtowni (' + r.hw + ')', etykieta: 'Utworzono etykietę – list ' + (r.label ? r.label.nr : ''), wyslane: 'Kurier odebrał paczkę', doreczone: 'Paczka doręczona', anulowane: 'Zamówienie anulowane', nowe: 'Status: nowe' }[st];
  r.history.push({ t: Date.now(), txt: note || txt });
  var mailType = { zamowione: 'zamowione', wyslane: 'wyslane', doreczone: 'doreczone' }[st];
  if (mailType && S.settings.autoMail) {
    r.mails.push({ t: Date.now(), type: mailType });
    toast('Mail do klienta wysłany: „' + MAILNAME[mailType] + '”', 'ok', { label: 'Podgląd', fn: function () { showMail(r, mailType); } });
  }
  if (st === 'doreczone' && S.settings.autoDoc) setTimeout(function () { autoDocs(r); }, 900);
}
function autoDocs(r) {
  var tot = orderTotal(r); var draft = r.invoice && S.settings.draftInv;
  if (!r.docs.some(function (id) { var d = byId(S.docs, id); return d && d.type === 'pz'; })) {
    var pz = { id: S.seq.doc++, type: 'pz', nr: 'PZ/' + (S.seq.inv++) + '/' + MON + '/' + YEAR, status: 'wystawiony', order: r.id, date: Date.now(), total: Math.round(r.items.reduce(function (s, x) { return s + x.qty * prod(x.pid).buy; }, 0) * 100) / 100 };
    S.docs.unshift(pz); r.docs.push(pz.id);
  }
  var d = { id: S.seq.doc++, type: r.invoice ? 'faktura' : 'paragon', nr: draft ? null : (r.invoice ? 'FV/' : 'PAR/') + (S.seq.inv++) + '/' + MON + '/' + YEAR, status: draft ? 'szkic' : 'wystawiony', order: r.id, date: Date.now(), total: tot };
  S.docs.unshift(d); r.docs.push(d.id);
  r.history.push({ t: Date.now(), txt: (d.type === 'faktura' ? 'Faktura' : 'Paragon') + (draft ? ' – wersja robocza do zatwierdzenia' : ' wystawiony automatycznie: ' + d.nr) + ' + PZ' });
  toast((d.type === 'faktura' ? 'Faktura' : 'Paragon') + (draft ? ' czeka na zatwierdzenie w Dokumentach' : ' wystawiony automatycznie'), 'ok', { label: 'Dokumenty', fn: function () { go('dokumenty'); } });
  rerender();
}
function showMail(r, type) { modal('<h3>Podgląd maila</h3><p class="small muted" style="margin:0 0 14px">Tak klient widzi tę wiadomość.</p>' + orderMail(r, type), true); }
function buyOrders(ids, cb) {
  work('Zamawiam w hurtowni', ['Łączę z hurtownią…', 'Sprawdzam dostępność ' + ids.reduce(function (s, id) { return s + order(id).items.length; }, 0) + ' pozycji…', 'Składam zamówienie…', 'Zapisuję numer zamówienia…'], function () {
    var hw = 'HW/' + YEAR + '/' + (S.seq.hw++);
    ids.forEach(function (id) { var r = order(id); r.hw = hw; setStatus(r, 'zamowione'); });
    toast('Zamówione w hurtowni: ' + hw);
    if (cb) cb(); else rerender();
  });
}

  document.getElementById('lbSize').onclick = function (e) { var b = e.target.closest('.chip'); if (!b) return; var v = b.dataset.v.split('|'); ['lbKg', 'lbL', 'lbW', 'lbH'].forEach(function (id, i) { document.getElementById(id).value = v[i]; }); this.querySelectorAll('.chip').forEach(function (x) { x.classList.toggle('on', x === b); }); };

      r.label = { nr: (car === 'Paczkomat' ? '6' : '52') + digits(car === 'Paczkomat' ? 21 : 14), carrier: car, kg: kg };

/* ---- ZAMÓW W HURTOWNI ---- */
VIEWS.hurtownia = function () {
  var list = S.orders.filter(function (r) { return r.status === 'nowe'; }).sort(function (a, b) { return a.date - b.date; });
  var parts = {}; list.forEach(function (r) { r.items.forEach(function (x) { var p = prod(x.pid); if (!parts[p.id]) parts[p.id] = { p: p, qty: 0, orders: [] }; parts[p.id].qty += x.qty; parts[p.id].orders.push(r.id); }); });
  var pl = Object.keys(parts).map(function (k) { return parts[k]; });
  var sum = pl.reduce(function (s, x) { return s + x.qty * x.p.buy; }, 0);
  view('<div class="head"><div><h1>Zamów w hurtowni</h1><p class="muted small">Wszystkie nowe zamówienia w jednym miejscu. Części z kilku zamówień łączą się w jedno zamówienie u dostawcy.</p></div></div>' +
    (list.length ? '<div class="split"><div><div class="card"><h2>Części do zamówienia <span class="muted small" style="font-weight:600">' + pl.length + ' pozycji</span></h2><div class="tbl-wrap" style="border:0;margin:0 -4px"><table class="tbl"><thead><tr><th>Część</th><th>Zamówienia</th><th class="n">Ilość</th><th class="n">Zakup netto</th></tr></thead><tbody>' +
      pl.map(function (x) { return '<tr><td class="ttl"><b>' + esc(x.p.name) + '</b><div class="mono small muted">' + esc(x.p.nr) + '</div></td><td data-l="Zamówienia" class="small">' + x.orders.map(function (id) { return '<a data-go="zamowienie/' + id + '" style="cursor:pointer;text-decoration:underline">#' + id + '</a>'; }).join(', ') + '</td><td class="n" data-l="Ilość">' + x.qty + '</td><td class="n" data-l="Zakup">' + zl(x.qty * x.p.buy) + '</td></tr>'; }).join('') +
      '</tbody></table></div></div></div><div><div class="card"><h2>Podsumowanie</h2><div class="row"><span>Zamówień</span><b>' + list.length + '</b></div><div class="row"><span>Pozycji</span><b>' + pl.length + '</b></div><div class="row"><span class="total">Zakup netto</span><span class="total">' + zl(sum) + '</span></div><div style="margin:12px 0">' + list.map(function (r) { return '<label style="display:flex;gap:8px;align-items:center;padding:4px 0;font-size:14px;cursor:pointer"><input type="checkbox" class="hwSel" value="' + r.id + '" checked> #' + r.id + ' · ' + esc(cust(r.cust).name) + '</label>'; }).join('') + '</div><button type="button" class="btn btn--gold btn--block" data-act="buyAll">Zamów zaznaczone w hurtowni</button><p class="small muted" style="margin:10px 0 0">W prawdziwym panelu zamówienie idzie prosto do systemu hurtowni, a numer zapisuje się przy każdym zamówieniu.</p></div></div></div>'
      : '<div class="card"><p class="empty">Nie ma nic do zamówienia<br><button type="button" class="btn btn--line btn--sm" style="margin-top:12px" data-act="simOrder">Symuluj nowe zamówienie</button></p></div>'));
  return { t: 'Zamów w hurtowni' };
};

/* ---- PRODUKTY ---- */
VIEWS.produkty = function () {
  var q = UI.prodQ.toLowerCase().replace(/[\s-]/g, '');
  var list = S.products.filter(function (p) { return (UI.prodF === 'all' || p.av === UI.prodF) && (!q || (p.nr + p.name).toLowerCase().replace(/[\s-]/g, '').indexOf(q) >= 0); });
  var last = Math.max.apply(null, S.products.map(function (p) { return p.synced; }));
  view('<div class="head"><div><h1>Produkty</h1><p class="muted small">' + S.products.length + ' produktów · ostatnia synchronizacja z hurtownią: ' + dt(last) + '</p></div><button type="button" class="btn btn--gold" data-act="sync">⟳ Synchronizuj z hurtownią</button></div>' +
    '<div class="toolbar"><label class="search">' + ico('search') + '<input class="inp" id="prodQ" placeholder="Numer części albo nazwa, np. A4-210 albo klocki" value="' + esc(UI.prodQ) + '"></label></div>' +
    '<div class="chips">' + [['all', 'Wszystkie'], ['now', 'Od ręki'], ['order', 'Na zamówienie']].map(function (x) { return '<button type="button" class="chip' + (UI.prodF === x[0] ? ' on' : '') + '" data-act="prodF" data-v="' + x[0] + '">' + x[1] + '</button>'; }).join('') + '</div>' +
    (list.length ? '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Produkt</th><th>Numer części</th><th>Stan</th><th class="n">Zakup</th><th class="n">Cena</th><th class="n">Marża</th></tr></thead><tbody>' +
      list.map(function (p) { var m = p.price / 1.23 - p.buy; return '<tr class="click" data-act="prodView" data-id="' + p.id + '"><td class="ttl"><b>' + esc(p.name) + '</b></td><td data-l="Numer" class="mono">' + esc(p.nr) + '</td><td data-l="Stan">' + (p.av === 'now' ? '<span class="pill" style="--c:#1D6B3A">Od ręki · ' + p.qty + ' szt.</span>' : '<span class="pill" style="--c:#8A5A12">Na zamówienie 1–2 dni</span>') + '</td><td class="n" data-l="Zakup netto">' + zl(p.buy) + '</td><td class="n" data-l="Cena brutto"><b style="color:var(--ink)">' + zl(p.price) + '</b></td><td class="n" data-l="Marża netto"><span class="' + (m > 0 ? 'green' : 'red') + '">' + zl(m) + '</span></td></tr>'; }).join('') + '</tbody></table></div>'
      : '<div class="card"><p class="empty">Nic nie znaleziono dla „' + esc(UI.prodQ) + '”.<br><span class="small">W prawdziwym panelu brakujący numer można od razu pobrać z hurtowni i dodać do sklepu.</span></p></div>'));
  var i = document.getElementById('prodQ'); i.oninput = function () { UI.prodQ = i.value; var pos = i.selectionStart; VIEWS.produkty(); var j = document.getElementById('prodQ'); j.focus(); j.setSelectionRange(pos, pos); };
  return { t: 'Produkty' };
};
function prodModal(p) {
  modal('<h3>' + esc(p.name) + '</h3><p class="mono small muted" style="margin:0 0 14px">' + esc(p.nr) + '</p>' +
    '<div class="row"><span>Stan w hurtowni</span><b>' + (p.av === 'now' ? '<span class="green">Od ręki – ' + p.qty + ' szt.</span>' : '<span class="gold">Na zamówienie (1–2 dni)</span>') + '</b></div>' +
    '<div class="row"><span>Cena zakupu netto</span><b>' + zl(p.buy) + '</b></div>' +
    '<div class="row"><span>Zsynchronizowano</span><b>' + dt(p.synced) + '</b></div>' +
    '<label class="f" style="margin-top:14px">Cena sprzedaży brutto<input class="inp" id="pPrice" value="' + p.price.toFixed(2).replace('.', ',') + '" inputmode="decimal"></label><p class="small" id="pMargin" style="margin:6px 0 0"></p>' +
    '<div class="modal__foot"><button type="button" class="btn btn--line" id="pSync">⟳ Odśwież z hurtowni</button><button type="button" class="btn btn--gold" id="pSave">Zapisz cenę</button></div>');
  var inp = document.getElementById('pPrice');
  function mg() { var m = num(inp.value) / 1.23 - p.buy; var el = document.getElementById('pMargin'); el.innerHTML = 'Marża netto: <b class="' + (m >= S.settings.minProfit ? 'green' : 'red') + '">' + zl(m) + '</b>' + (m < S.settings.minProfit ? ' – poniżej minimalnego zysku (' + zl(S.settings.minProfit) + ')' : ''); }
  inp.oninput = mg; mg();
  document.getElementById('pSave').onclick = function () { var v = num(inp.value); if (v <= 0) { toast('Podaj cenę', 'err'); return; } p.price = Math.round(v * 100) / 100; closeModal(); toast('Cena zapisana – w sklepie od razu nowa'); rerender(); };
  document.getElementById('pSync').onclick = function () { work('Pobieram dane z hurtowni', ['Łączę z hurtownią…', 'Pobieram cenę i stan ' + p.nr + '…'], function () { p.synced = Date.now(); if (Math.random() < .5) { p.buy = Math.round(p.buy * (1 + rnd(-3, 4) / 100) * 100) / 100; } toast('Zaktualizowano: ' + p.name); rerender(); prodModal(p); }, 500); };
}
function syncAll() {
  var m = modal('<div class="loader"><div class="spin"></div><h3 style="margin:0">Synchronizacja z hurtownią</h3><div class="prog"><i id="sp"></i></div><p class="small muted" id="st" style="margin:0">Łączę…</p></div>');
  m.dataset.lock = 1; m.querySelector('.x').style.display = 'none';
  var n = S.products.length, i = 0, chP = 0, chS = 0;
  var tm = setInterval(function () {
    var p = S.products[i];
    if (Math.random() < .18) { var nb = Math.round(p.buy * (1 + rnd(-4, 6) / 100) * 100) / 100; if (nb !== p.buy) { p.buy = nb; chP++; } }
    if (Math.random() < .14) { if (p.av === 'now' && p.qty <= 2) { p.av = 'order'; p.qty = 0; } else if (p.av === 'order') { p.av = 'now'; p.qty = rnd(1, 8); } else p.qty = Math.max(1, p.qty + rnd(-2, 3)); chS++; }
    p.synced = Date.now(); i++;
    document.getElementById('sp').style.width = Math.round(i / n * 100) + '%';
    document.getElementById('st').textContent = i + ' / ' + n + ' · ' + p.nr;
    if (i >= n) { clearInterval(tm); setTimeout(function () {
      closeModal();
      modal('<h3>✓ Synchronizacja zakończona</h3><div class="row"><span>Sprawdzono produktów</span><b>' + n + '</b></div><div class="row"><span>Zmienione ceny zakupu</span><b>' + chP + '</b></div><div class="row"><span>Zmienione stany</span><b>' + chS + '</b></div><p class="small muted" style="margin:12px 0 0">W prawdziwym panelu dzieje się to samo co noc – ceny w sklepie przeliczają się tak, żeby marża się zgadzała.</p><div class="modal__foot"><button type="button" class="btn" data-act="close">OK</button></div>');
      rerender(); }, 300); }
  }, 70);
}

  view('<div class="head"><div><h1>Oferty</h1><p class="muted small">Wycena dla klienta w minutę: wpisz numery części, ustaw rabat, wyślij. Klient akceptuje – zamówienie robi się samo.</p></div><button type="button" class="btn btn--gold" data-act="newOffer">+ Nowa oferta</button></div>' +

    '<div class="card"><h2>Integracje</h2><div class="small"><div class="row"><span>Hurtownia (zamówienia, ceny, stany)</span><b class="green">● połączona</b></div><div class="row"><span>Kurierzy (etykiety, śledzenie)</span><b class="green">● połączona</b></div><div class="row"><span>System księgowy (faktury, PZ)</span><b class="green">● połączona</b></div><div class="row"><span>Płatności online</span><b class="green">● połączona</b></div></div><p class="small muted" style="margin:10px 0 0">W demo wszystkie integracje są udawane.</p></div>' +
    '</div></div>');
  return { t: 'Ustawienia' };
};

/* ================== AKCJE ================== */
var ACT = {
  close: function () { closeModal(); },
  menu: function () { document.getElementById('side').classList.toggle('open'); },
  reset: function () { confirmBox('Zacząć od nowa?', 'Wszystkie zmiany w demo wrócą do stanu początkowego.', 'Zacznij od nowa', function () { S = seed(); UI = { ordF: 'all', ordQ: '', prodQ: '', prodF: 'all', custQ: '', docT: 'paragon' }; if (location.hash && location.hash !== '#pulpit') location.hash = 'pulpit'; else route(); toast('Demo wróciło do stanu początkowego'); }); },
  print: function () { closeModal(); toast('Wysłano do drukarki etykiet (demo)'); },
  ordF: function (el) { UI.ordF = el.dataset.v; if (location.hash.indexOf('/f/') >= 0) location.hash = 'zamowienia'; else rerender(); },
  prodF: function (el) { UI.prodF = el.dataset.v; rerender(); },
  docT: function (el) { UI.docT = el.dataset.v; rerender(); },
  buyOne: function (el) { buyOrders([+el.dataset.id]); },
  buyAll: function () { var ids = [].map.call(document.querySelectorAll('.hwSel:checked'), function (x) { return +x.value; }); if (!ids.length) { toast('Zaznacz co najmniej jedno zamówienie', 'err'); return; } buyOrders(ids, function () { go('zamowienia'); }); },
  haveIt: function (el) { var r = order(+el.dataset.id); confirmBox('Części na miejscu?', 'Zamówienie pominie hurtownię i od razu przejdzie do etykiety.', 'Tak, mam części', function () { r.hw = 'magazyn'; r.status = 'zamowione'; r.history.push({ t: Date.now(), txt: 'Części z magazynu – bez zamawiania w hurtowni' }); toast('Oznaczone – możesz utworzyć etykietę'); rerender(); }); },
  label: function (el) { labelModal(order(+el.dataset.id)); },
  showLabel: function (el) { showLabel(order(+el.dataset.id)); },
  setSt: function (el) { var r = order(+el.dataset.id); var v = el.dataset.v; work(v === 'doreczone' ? 'Sprawdzam status u kuriera' : 'Zapisuję', v === 'doreczone' ? ['Łączę z kurierem…', 'Status: doręczona ✓'] : ['Aktualizuję zamówienie…'], function () { setStatus(r, v); rerender(); }, 500); },
  stManual: function (el) { var r = order(+el.dataset.id); var v = document.getElementById('stSel').value; if (v === r.status) return; if (v === 'zamowione' && !r.hw) r.hw = 'HW/' + YEAR + '/' + (S.seq.hw++); if ((v === 'etykieta' || v === 'wyslane' || v === 'doreczone') && !r.label) r.label = { nr: '52' + digits(14), carrier: 'Kurier', kg: 3 }; setStatus(r, v, 'Status zmieniony ręcznie: ' + ST[v].l); toast('Status zmieniony'); rerender(); },
  mailView: function (el) { showMail(order(+el.dataset.id), el.dataset.v); },
  simOrder: function () {
    var c = S.customers[rnd(0, S.customers.length - 1)]; var n = rnd(1, 3), items = [], used = {};
    while (items.length < n) { var p = S.products[rnd(0, S.products.length - 1)]; if (used[p.id]) continue; used[p.id] = 1; items.push({ pid: p.id, qty: rnd(1, 2), price: p.price }); }
    var r = { id: S.seq.order++, cust: c.id, items: items, status: 'nowe', date: Date.now(), pay: ['Płatność online · opłacone', 'Za pobraniem', 'Przelew · opłacone'][rnd(0, 2)], ship: { name: 'Kurier', cost: 25 }, invoice: !!c.company, hw: null, label: null, docs: [], history: [{ t: Date.now(), txt: 'Zamówienie złożone w sklepie' }], mails: [] };
    if (itemsSum(r) >= S.settings.freeFrom) r.ship.cost = 0;
    S.orders.push(r);
    if (S.settings.autoMail) r.mails.push({ t: Date.now(), type: 'nowe' });
    toast('Nowe zamówienie #' + r.id + ' od ' + c.name, 'ok', { label: 'Otwórz', fn: function () { go('zamowienie/' + r.id); } });
    rerender();
  },
  sync: syncAll,
  prodView: function (el) { prodModal(prod(+el.dataset.id)); },
  newOffer: function (el) { newOffer(el && el.dataset.id ? +el.dataset.id : 0); },
  ofDel: function (el) { var of = byId(S.offers, +location.hash.split('/')[1]); of.items.splice(+el.dataset.i, 1); rerender(); },
  ofPreview: function (el) { var of = byId(S.offers, +el.dataset.id); if (!of.items.length) { toast('Dodaj najpierw części', 'err'); return; } modal('<h3>Podgląd oferty</h3><p class="small muted" style="margin:0 0 14px">Tak wygląda PDF w załączniku i strona oferty dla klienta.</p>' + offerDoc(of) + '<div class="modal__foot"><button type="button" class="btn btn--line" data-act="close">Zamknij</button><button type="button" class="btn" data-act="pdf">Pobierz PDF</button></div>', true); },
  pdf: function () { closeModal(); toast('W demo PDF się nie pobiera – w panelu tak'); },
  ofSend: function (el) {
    var of = byId(S.offers, +el.dataset.id); var c = cust(of.cust);
    if (!c) { toast('Wybierz najpierw klienta', 'err'); return; } if (!of.items.length) { toast('Dodaj części do oferty', 'err'); return; }
    modal('<h3>Wyślij ofertę ' + esc(of.nr) + '</h3><p class="small muted" style="margin:0 0 14px">Klient dostanie maila z PDF i przyciskiem „Zobacz ofertę i zamów”. Zobaczysz, kiedy go otworzy.</p><label class="f">E-mail klienta<input class="inp" id="osTo" value="' + esc(c.email) + '"></label><label class="f" style="margin-top:12px">Wiadomość <small>(opcjonalnie)</small><textarea class="inp" id="osMsg" rows="3" placeholder="Dzień dobry, zgodnie z rozmową przesyłam ofertę…"></textarea></label><div class="modal__foot"><button type="button" class="btn btn--line" id="osPrev">Podgląd maila</button><button type="button" class="btn btn--gold" id="osGo">Wyślij</button></div>');
    document.getElementById('osPrev').onclick = function () { var msg = document.getElementById('osMsg').value.trim(); var to = document.getElementById('osTo').value; var html = mailHtml('oferta', { nr: of.nr, sum: zl(offerCalc(of).total), msg: msg ? esc(msg) + '<br><br>' : '' }, to); var w = document.createElement('div'); w.innerHTML = '<div style="margin-top:14px">' + html + '</div>'; var old = modalEl.querySelector('.mailprev'); if (old) old.remove(); w.className = 'mailprev'; modalEl.querySelector('.modal__foot').before(w); };
    document.getElementById('osGo').onclick = function () { var to = document.getElementById('osTo').value.trim(); if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(to)) { toast('Sprawdź adres e-mail', 'err'); return; } work('Wysyłam ofertę', ['Generuję PDF…', 'Wysyłam maila do ' + to + '…'], function () { of.status = 'wysłana'; of.date = Date.now(); toast('Oferta wysłana – zobaczysz, kiedy klient ją otworzy'); rerender(); setTimeout(function () { if (of.status === 'wysłana') { of.status = 'otwarta'; toast('Klient otworzył ofertę ' + of.nr); if (location.hash.indexOf('oferta') >= 0 || location.hash.indexOf('oferty') >= 0) rerender(); } }, 7000); }); };
  },
  ofAccept: function (el) {
    var of = byId(S.offers, +el.dataset.id); var c = cust(of.cust);
    if (!c) { toast('Wybierz najpierw klienta', 'err'); return; } if (!of.items.length) { toast('Dodaj części do oferty', 'err'); return; }
    confirmBox('Utworzyć zamówienie?', 'Z oferty powstanie zamówienie dla <b>' + esc(c.name) + '</b> na <b>' + zl(offerCalc(of).total) + '</b>. Trafi do „Zamów w hurtowni”.', 'Utwórz zamówienie', function () {
      work('Tworzę zamówienie', ['Zakładam zamówienie w sklepie…', 'Wysyłam potwierdzenie do klienta…'], function () {
        var k = offerCalc(of); var f = k.sum ? (k.sum - k.disc) / k.sum : 1;
        var r = { id: S.seq.order++, cust: c.id, items: of.items.map(function (x) { return { pid: x.pid, qty: x.qty, price: Math.round(x.price * f * 100) / 100 }; }), status: 'nowe', date: Date.now(), pay: 'Płatność online · opłacone', ship: { name: 'Kurier', cost: k.ship }, invoice: !!c.company, hw: null, label: null, docs: [], history: [{ t: Date.now(), txt: 'Zamówienie z oferty ' + of.nr }], mails: [] };
        if (S.settings.autoMail) r.mails.push({ t: Date.now(), type: 'nowe' });
        S.orders.push(r); of.status = 'zaakceptowana'; of.order = r.id;
        toast('Zamówienie #' + r.id + ' utworzone', 'ok', { label: 'Otwórz', fn: function () { go('zamowienie/' + r.id); } });
        rerender();
      });
    });
  },
  newCust: function () {
    modal('<h3>Nowy klient</h3><div class="grid" style="gap:10px;margin-top:10px"><label class="f">Imię i nazwisko<input class="inp" id="ncN" autofocus></label><label class="f">Firma <small>(opcjonalnie)</small><input class="inp" id="ncC"></label><div class="grid g2" style="gap:10px"><label class="f">Telefon<input class="inp" id="ncP" inputmode="tel"></label><label class="f">Miasto<input class="inp" id="ncCity"></label></div><label class="f">E-mail<input class="inp" id="ncE" type="email"></label></div><div class="modal__foot"><button type="button" class="btn btn--line" data-act="close">Anuluj</button><button type="button" class="btn btn--gold" id="ncGo">Dodaj</button></div>');
    document.getElementById('ncGo').onclick = function () { var n = document.getElementById('ncN').value.trim(); if (!n) { toast('Wpisz imię i nazwisko', 'err'); return; } var c = { id: Math.max.apply(null, S.customers.map(function (x) { return x.id; })) + 1, name: n, company: document.getElementById('ncC').value.trim(), city: document.getElementById('ncCity').value.trim() || '—', street: '', post: '', email: document.getElementById('ncE').value.trim() || 'brak@example.com', phone: document.getElementById('ncP').value.trim() || '—', partner: 0, since: Date.now(), cars: [], notes: [] }; S.customers.push(c); closeModal(); toast('Klient dodany'); go('klient/' + c.id); };
  },
  addCar: function (el) {
    var c = cust(+el.dataset.id);
    modal('<h3>Dodaj auto – ' + esc(c.name) + '</h3><div class="grid" style="gap:10px;margin-top:10px"><label class="f">Marka i model<input class="inp" id="acM" placeholder="np. Audi A6 3.0 TDI" autofocus></label><div class="grid g2" style="gap:10px"><label class="f">Rok<input class="inp" id="acY" inputmode="numeric" placeholder="2019"></label><label class="f">VIN <small>(opcjonalnie)</small><input class="inp" id="acV" placeholder="17 znaków"></label></div></div><p class="small muted" style="margin:10px 0 0">Z VIN-em w prawdziwym panelu dobierasz części do konkretnego auta.</p><div class="modal__foot"><button type="button" class="btn btn--line" data-act="close">Anuluj</button><button type="button" class="btn btn--gold" id="acGo">Dodaj auto</button></div>');
    document.getElementById('acGo').onclick = function () { var m = document.getElementById('acM').value.trim(); if (!m) { toast('Wpisz markę i model', 'err'); return; } c.cars.push({ m: m, y: document.getElementById('acY').value.trim() || '—', vin: document.getElementById('acV').value.trim().toUpperCase() }); closeModal(); toast('Auto dodane do garażu klienta'); rerender(); };
  },
  addNote: function (el) { var c = cust(+el.dataset.id); var t = document.getElementById('noteTxt').value.trim(); if (!t) { toast('Wpisz treść notatki', 'err'); return; } c.notes.push({ t: Date.now(), txt: t }); toast('Notatka zapisana'); rerender(); },
  docView: function (el) { var d = byId(S.docs, +el.dataset.id); modal('<h3>Podgląd dokumentu</h3><p class="small muted" style="margin:0 0 14px">' + (d.status === 'szkic' ? 'Wersja robocza – zatwierdź, żeby nadać numer i wysłać klientowi.' : 'Dokument wystawiony.') + '</p>' + docHtml(d) + '<div class="modal__foot"><button type="button" class="btn btn--line" data-act="close">Zamknij</button>' + (d.status === 'szkic' ? '<button type="button" class="btn btn--gold" data-act="docOk" data-id="' + d.id + '">Zatwierdź i wyślij</button>' : '') + '</div>', true); },
  docOk: function (el) { var d = byId(S.docs, +el.dataset.id); closeModal(); work('Wystawiam dokument', ['Wysyłam do systemu księgowego…', 'Nadaję numer…', 'Wysyłam PDF do klienta…'], function () { d.status = 'wystawiony'; d.nr = (d.type === 'faktura' ? 'FV/' : 'PAR/') + (S.seq.inv++) + '/' + MON + '/' + YEAR; d.date = Date.now(); var r = order(d.order); if (r) { r.history.push({ t: Date.now(), txt: (d.type === 'faktura' ? 'Faktura ' : 'Paragon ') + d.nr + ' zatwierdzony i wysłany do klienta' }); r.mails.push({ t: Date.now(), type: 'dokument' }); } toast('Wystawiono ' + d.nr + ' – PDF poszedł do klienta'); rerender(); }); },
  docSend: function (el) { var d = byId(S.docs, +el.dataset.id); var r = order(d.order); work('Wysyłam dokument', ['Pobieram PDF…', 'Wysyłam do ' + (r ? cust(r.cust).email : 'klienta') + '…'], function () { if (r) r.mails.push({ t: Date.now(), type: 'dokument' }); toast(d.nr + ' wysłany do klienta'); }, 450); },
  setSave: function () { var s = S.settings; s.minProfit = num(document.getElementById('setMin').value) || 0; s.freeFrom = num(document.getElementById('setFree').value) || 0; s.cutoff = document.getElementById('setCut').value || s.cutoff; toast('Ustawienia zapisane'); }
};
MAILS.dokument && (MAILNAME.dokument = 'Dokument sprzedaży (PDF)');
var _orderMail = orderMail;
orderMail = function (r, type) {
  if (type === 'dokument') { var c = cust(r.cust); var d = r.docs.map(function (id) { return byId(S.docs, id); }).filter(function (x) { return x && x.type !== 'pz'; })[0]; return mailHtml('dokument', { nr: r.id, sum: zl(orderTotal(r)), doc: d ? (d.type === 'faktura' ? 'Fakturę ' : 'Paragon ') + (d.nr || '') : 'Dokument' }, c.name + ' <' + c.email + '>'); }
  return _orderMail(r, type);
};

/* ================== ZDARZENIA ================== */
document.addEventListener('click', function (e) {
  var a = e.target.closest('[data-act]');
  if (a && ACT[a.dataset.act]) { e.preventDefault(); ACT[a.dataset.act](a); return; }
  var sd = document.getElementById('side'); if (sd.classList.contains('open') && !e.target.closest('#side')) { sd.classList.remove('open'); return; }
  var g = e.target.closest('[data-go]');
  if (g) { e.preventDefault(); go(g.dataset.go); return; }
  if (!e.target.closest('#ofSugg') && !e.target.closest('#ofAdd')) { var s = document.getElementById('ofSugg'); if (s) s.hidden = true; }
});
document.addEventListener('change', function (e) {
  var t = e.target; if (t.dataset && t.dataset.set) { S.settings[t.dataset.set] = t.checked; toast((t.checked ? 'Włączone: ' : 'Wyłączone: ') + t.closest('.switch').querySelector('b').textContent); }
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && modalEl && !modalEl.dataset.lock) closeModal();
  if (e.key === 'Enter' && e.target.id === 'ofAdd') { var b = document.querySelector('#ofSugg [data-pid]'); if (b) { e.preventDefault(); b.click(); } }
});
window.addEventListener('hashchange', route);

S = seed();
route();
setTimeout(function () { toast('To demo – wszystko możesz klikać, nic się nie zepsuje', 'ok'); }, 700);
})();
</script>
